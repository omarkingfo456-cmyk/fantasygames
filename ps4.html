<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090f">
  <title>FANTASY STORE | ألعاب PS4</title>

  <style>
    :root {
      --bg: #08090f;
      --panel: #121420;
      --panel2: #191b2b;
      --purple: #7546ff;
      --cyan: #35d9ff;
      --text: #f5f5ff;
      --muted: #a6a8bd;
      --border: #292b40;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Tahoma, Arial, sans-serif;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button, a {
      -webkit-tap-highlight-color: transparent;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    header {
      padding: 25px 16px;
      text-align: center;
      background: linear-gradient(135deg, #17102e, #101522, #08090f);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      margin: 0;
      color: #fff;
      font-size: clamp(27px, 6vw, 43px);
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 0 0 22px #7546ff88;
    }

    .logo span {
      color: var(--purple);
    }

    .subtitle {
      color: var(--muted);
      margin: 10px 0 0;
      font-size: 14px;
    }

    .top-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .btn {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 16px;
      background: var(--panel2);
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      transition: .2s;
    }

    .btn:hover {
      border-color: var(--purple);
      transform: translateY(-1px);
    }

    .btn-primary {
      border: none;
      background: linear-gradient(135deg, #7546ff, #5325d5);
      color: white;
      font-weight: bold;
    }

    main {
      max-width: 1250px;
      margin: auto;
      padding: 22px 14px 45px;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .search-box input {
      width: 100%;
      min-width: 0;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: white;
      outline: none;
    }

    .search-box input:focus,
    .field:focus {
      border-color: var(--purple);
    }

    .categories {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    .category-btn {
      padding: 9px 15px;
      border-radius: 20px;
      background: var(--panel);
      color: var(--muted);
      border: 1px solid var(--border);
      cursor: pointer;
    }

    .category-btn.active {
      color: white;
      background: #7546ff33;
      border-color: var(--purple);
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 22px 0 15px;
    }

    .section-heading h2 {
      font-size: 20px;
      margin: 0;
    }

    .count {
      color: var(--cyan);
      font-size: 13px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 15px;
    }

    .game-card {
      min-width: 0;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      transition: .2s;
    }

    .game-card:hover {
      transform: translateY(-4px);
      border-color: var(--purple);
      box-shadow: 0 8px 25px #7546ff18;
    }

    .game-image {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      display: block;
      background: #191b2b;
    }

    .image-placeholder {
      aspect-ratio: 3 / 4;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      text-align: center;
      background: linear-gradient(145deg, #25164b, #111522);
      color: #d7caff;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .game-info {
      padding: 12px;
    }

    .game-title {
      font-size: 15px;
      line-height: 1.6;
      margin: 0 0 8px;
      overflow-wrap: anywhere;
    }

    .game-size {
      display: inline-block;
      color: var(--cyan);
      background: #35d9ff12;
      border: 1px solid #35d9ff30;
      border-radius: 7px;
      padding: 5px 8px;
      font-size: 12px;
      margin-bottom: 11px;
    }

    .details-btn {
      width: 100%;
      padding: 10px 7px;
      border: 1px solid #7546ff88;
      border-radius: 9px;
      background: #7546ff19;
      color: white;
      cursor: pointer;
    }

    .details-btn:hover {
      background: var(--purple);
    }

    .empty-state {
      display: none;
      text-align: center;
      color: var(--muted);
      padding: 40px 15px;
      background: var(--panel);
      border-radius: 12px;
      border: 1px dashed var(--border);
    }

    dialog {
      width: min(92%, 480px);
      max-height: 85vh;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      background: var(--panel);
      color: var(--text);
    }

    dialog::backdrop {
      background: #000c;
      backdrop-filter: blur(4px);
    }

    .dialog-title {
      margin: 0 0 14px;
      color: var(--cyan);
      line-height: 1.6;
    }

    .detail-row {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .detail-label {
      color: var(--muted);
    }

    .description {
      line-height: 1.9;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    footer {
      text-align: center;
      padding: 22px 12px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
    }

    .light-mode {
      --bg: #f3f3fa;
      --panel: #ffffff;
      --panel2: #eeeeFA;
      --text: #19152a;
      --muted: #68667b;
      --border: #dcd9eb;
    }

    .light-mode header {
      background: linear-gradient(135deg, #e9e0ff, #f5f6ff);
    }

    .light-mode .logo {
      color: #211541;
    }

    .light-mode .search-box input {
      color: #19152a;
    }

    @media (max-width: 400px) {
      .games-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .game-info {
        padding: 9px;
      }

      .game-title {
        font-size: 13px;
      }

      .btn {
        padding: 10px 12px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1 class="logo">FANTASY <span>STORE</span></h1>
    <p class="subtitle">مكتبة ألعاب PlayStation 4</p>

    <div class="top-actions">
      <a class="btn btn-primary" href="edit.html">⚙️ تعديل</a>
      <button class="btn" id="themeButton" type="button">☀️ تغيير المظهر</button>
    </div>
  </header>

  <main>
    <div class="search-box">
      <input
        id="searchInput"
        type="search"
        placeholder="🔎 ابحث عن اسم اللعبة..."
        aria-label="البحث عن لعبة"
      >
    </div>

    <nav class="categories" id="categories" aria-label="تصنيفات الألعاب">
      <button class="category-btn active" data-category="all">كل الألعاب</button>
      <button class="category-btn" data-category="action">أكشن</button>
      <button class="category-btn" data-category="adventure">مغامرات</button>
      <button class="category-btn" data-category="horror">رعب</button>
      <button class="category-btn" data-category="sports">رياضة</button>
      <button class="category-btn" data-category="racing">سباق</button>
      <button class="category-btn" data-category="kids">أطفال</button>
    </nav>

    <div class="section-heading">
      <h2>🎮 مكتبة الألعاب</h2>
      <span class="count" id="gamesCount">0 لعبة</span>
    </div>

    <section class="games-grid" id="gamesList"></section>

    <div class="empty-state" id="emptyState">
      مفيش ألعاب مطابقة للبحث ده.
    </div>
  </main>

  <dialog id="gameDialog">
    <h2 class="dialog-title" id="dialogTitle"></h2>
    <div id="dialogInfo"></div>

    <h3>📝 وصف اللعبة</h3>
    <p class="description" id="dialogDesc"></p>

    <button class="btn btn-primary" id="closeDialog" type="button">
      إغلاق
    </button>
  </dialog>

  <footer>
    FANTASY STORE © <span id="currentYear"></span>
    <br>
    مكتبة ألعاب PS4
  </footer>

  <script>
    "use strict";

    /*
      الألعاب المضافة من صفحة edit.html تُقرأ من التخزين المحلي.
      تقدر تضيف الألعاب القديمة داخل المصفوفة أدناه.
    */

    const games = [
      {
        name: "God of War",
        image: "god-of-war.jpg",
        size: "45 جيجابايت",
        cat: ["action", "adventure"],
        players: "لاعب واحد",
        internet: "بدون إنترنت",
        desc: "مغامرة أكشن ملحمية مع كريتوس وابنه أتريوس في عالم الأساطير الإسكندنافية."
      },
      {
        name: "Uncharted 4",
        image: "uncharted-4.jpg",
        size: "48 جيجابايت",
        cat: ["action", "adventure"],
        players: "لاعب واحد",
        internet: "بدون إنترنت للقصة",
        desc: "مغامرة مليئة بالألغاز والاستكشاف والمطاردات بحثًا عن كنز القراصنة."
      },
      {
        name: "The Last of Us Part I",
        image: "the-last-of-us-part-1.jpg",
        size: "80 جيجابايت تقريبًا",
        cat: ["action", "adventure", "horror"],
        players: "لاعب واحد",
        internet: "بدون إنترنت للقصة",
        desc: "قصة مغامرة وبقاء في عالم اجتاحه وباء خطير."
      },
      {
        name: "Detroit: Become Human",
        image: "detroit-become-human.jpg",
        size: "45 جيجابايت تقريبًا",
        cat: ["adventure"],
        players: "لاعب واحد",
        internet: "بدون إنترنت",
        desc: "لعبة قصصية تفاعلية تتغير أحداثها ونهاياتها حسب اختياراتك."
      },
      {
        name: "Grand Theft Auto V",
        image: "gta-v.jpg",
        size: "90 جيجابايت تقريبًا",
        cat: ["action", "adventure"],
        players: "لاعب واحد في طور القصة",
        internet: "طور القصة بدون إنترنت",
        desc: "لعبة عالم مفتوح تضم مهمات ومركبات وأنشطة متنوعة."
      },
      {
        name: "Horizon Zero Dawn",
        image: "horizon-zero-dawn.jpg",
        size: "50 جيجابايت تقريبًا",
        cat: ["action", "adventure"],
        players: "لاعب واحد",
        internet: "بدون إنترنت",
        desc: "مغامرة في عالم مستقبلي تسيطر عليه آلات تشبه الحيوانات."
      },
      {
        name: "Marvel's Spider-Man",
        image: "spider-man.jpg",
        size: "45 جيجابايت تقريبًا",
        cat: ["action", "adventure"],
        players: "لاعب واحد",
        internet: "بدون إنترنت",
        desc: "تجربة أكشن في عالم مفتوح بشخصية سبايدر مان."
      },
      {
        name: "Ghost of Tsushima",
        image: "ghost-of-tsushima.jpg",
        size: "50 جيجابايت تقريبًا",
        cat: ["action", "adventure"],
        players: "لاعب واحد في طور القصة",
        internet: "بدون إنترنت للقصة",
        desc: "مغامرة أكشن في اليابان القديمة مع القتال بالسيوف والاستكشاف."
      }
    ];

    const storageKey = "fantasyStoreManagedGamesV1";

    const categoryNames = {
      action: "أكشن",
      adventure: "مغامرات",
      horror: "رعب",
      sports: "رياضة",
      racing: "سباق",
      kids: "أطفال"
    };

    function normalizeCategory(value) {
      const map = {
        "أكشن": "action",
        "مغامرات": "adventure",
        "رعب": "horror",
        "رياضة": "sports",
        "سباق": "racing",
        "أطفال": "kids"
      };

      return map[value] || value || "action";
    }

    function loadSavedGames() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || "[]");

        if (!Array.isArray(saved)) return [];

        return saved
          .filter(game => game && game.name)
          .map((game, index) => ({
            customId: game.id || `saved-${index}-${game.name}`,
            name: String(game.name),
            image: game.image || "",
            size: String(game.size ?? "غير محدد"),
            cat: [normalizeCategory(game.category || game.cat?.[0])],
            players: String(game.players || "غير محدد"),
            internet: normalizeInternet(game.internet),
            desc: String(game.description || game.desc || "لا يوجد وصف للعبة.")
          }));
      } catch (error) {
        console.error("تعذر قراءة الألعاب المحفوظة:", error);
        return [];
      }
    }

    function normalizeInternet(value) {
      const map = {
        offline: "بدون إنترنت",
        online: "تحتاج إنترنت",
        both: "أونلاين وأوفلاين",
        "بدون إنترنت": "بدون إنترنت",
        "أوفلاين": "بدون إنترنت",
        "أونلاين": "تحتاج إنترنت",
        "أونلاين وأوفلاين": "أونلاين وأوفلاين"
      };

      return map[value] || value || "غير محدد";
    }

    function getAllGames() {
      const savedGames = loadSavedGames();

      // منع تكرار الألعاب المحفوظة عند إعادة رسم الصفحة
      const savedNames = new Set(
        savedGames.map(game => game.name.trim().toLowerCase())
      );

      const originalGames = games.filter(
        game => !savedNames.has(game.name.trim().toLowerCase())
      );

      return [...originalGames, ...savedGames];
    }

    const gamesList = document.getElementById("gamesList");
    const searchInput = document.getElementById("searchInput");
    const gamesCount = document.getElementById("gamesCount");
    const emptyState = document.getElementById("emptyState");
    const gameDialog = document.getElementById("gameDialog");

    let selectedCategory = "all";

    function createGameCard(game, index) {
      const card = document.createElement("article");
      card.className = "game-card";

      if (game.image) {
        const img = document.createElement("img");
        img.className = "game-image";
        img.alt = game.name;
        img.loading = "lazy";
        img.src = game.image;

        img.addEventListener("error", () => {
          const placeholder = document.createElement("div");
          placeholder.className = "image-placeholder";
          placeholder.textContent = game.name;
          img.replaceWith(placeholder);
        });

        card.appendChild(img);
      } else {
        const placeholder = document.createElement("div");
        placeholder.className = "image-placeholder";
        placeholder.textContent = game.name;
        card.appendChild(placeholder);
      }

      const info = document.createElement("div");
      info.className = "game-info";

      const title = document.createElement("h3");
      title.className = "game-title";
      title.textContent = game.name;

      const size = document.createElement("div");
      size.className = "game-size";
      size.textContent = game.size;

      const detailsButton = document.createElement("button");
      detailsButton.type = "button";
      detailsButton.className = "details-btn";
      detailsButton.textContent = "عرض التفاصيل";

      detailsButton.addEventListener("click", () => {
        showDetails(game);
      });

      info.append(title, size, detailsButton);
      card.appendChild(info);

      return card;
    }

    function renderGames() {
      const searchTerm = searchInput.value.trim().toLowerCase();

      const filtered = getAllGames().filter(game => {
        const matchesSearch = game.name.toLowerCase().includes(searchTerm);

        const matchesCategory =
          selectedCategory === "all" ||
          (Array.isArray(game.cat) && game.cat.includes(selectedCategory));

        return matchesSearch && matchesCategory;
      });

      gamesList.replaceChildren();

      filtered.forEach((game, index) => {
        gamesList.appendChild(createGameCard(game, index));
      });

      gamesCount.textContent = `${filtered.length} لعبة`;
      emptyState.style.display = filtered.length ? "none" : "block";
    }

    function showDetails(game) {
      document.getElementById("dialogTitle").textContent = game.name;

      const info = document.getElementById("dialogInfo");
      info.replaceChildren();

      const rows = [
        ["المساحة", game.size],
        ["التصنيف", (game.cat || []).map(cat => categoryNames[cat] || cat).join("، ") || "غير محدد"],
        ["عدد اللاعبين", game.players || "غير محدد"],
        ["الإنترنت", game.internet || "غير محدد"]
      ];

      rows.forEach(([label, value]) => {
        const row = document.createElement("div");
        row.className = "detail-row";

        const labelElement = document.createElement("span");
        labelElement.className = "detail-label";
        labelElement.textContent = `${label}: `;

        const valueElement = document.createElement("span");
        valueElement.textContent = value;

        row.append(labelElement, valueElement);
        info.appendChild(row);
      });

      document.getElementById("dialogDesc").textContent =
        game.desc || "لا يوجد وصف للعبة.";

      if (typeof gameDialog.showModal === "function") {
        gameDialog.showModal();
      } else {
        alert(`${game.name}\n${game.desc || ""}`);
      }
    }

    document.getElementById("closeDialog").addEventListener("click", () => {
      gameDialog.close();
    });

    gameDialog.addEventListener("click", event => {
      if (event.target === gameDialog) {
        gameDialog.close();
      }
    });

    searchInput.addEventListener("input", renderGames);

    document.getElementById("categories").addEventListener("click", event => {
      const button = event.target.closest("[data-category]");
      if (!button) return;

      selectedCategory = button.dataset.category;

      document.querySelectorAll(".category-btn").forEach(item => {
        item.classList.toggle("active", item === button);
      });

      renderGames();
    });

    document.getElementById("themeButton").addEventListener("click", () => {
      document.body.classList.toggle("light-mode");

      localStorage.setItem(
        "fantasyStoreLightMode",
        document.body.classList.contains("light-mode") ? "on" : "off"
      );
    });

    if (localStorage.getItem("fantasyStoreLightMode") === "on") {
      document.body.classList.add("light-mode");
    }

    document.getElementById("currentYear").textContent =
      new Date().getFullYear();

    window.addEventListener("storage", event => {
      if (event.key === storageKey) renderGames();
    });

    renderGames();
  </script>

</body>
</html>
