<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ألعاب PS4 - FANTASY STORE</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;background:#fff;color:#292533;
    font-family:Arial,Tahoma,sans-serif
}
header{text-align:center;padding:30px 15px;border-bottom:1px solid #eee}
header h1{margin:0 0 10px;font-size:32px}
header h1 span{color:#7138d7}
header p{color:#777}
.home{
    display:inline-block;padding:10px 20px;border:1px solid #7138d7;
    color:#7138d7;text-decoration:none;border-radius:8px
}
.container{width:94%;max-width:1250px;margin:auto;padding:25px 0}
.search{
    display:block;width:100%;max-width:600px;margin:0 auto 25px;
    padding:14px;border:1px solid #ddd;border-radius:9px;font-size:16px
}
.categories{
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
    gap:12px;margin-bottom:30px
}
.category{
    min-height:65px;background:#fff;border:1px solid #ddd;
    border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer
}
.category:hover{border-color:#7138d7;color:#7138d7}
.category.active{background:#7138d7;color:white;border-color:#7138d7}
.count{color:#777;margin-bottom:15px}
.games{
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px
}
.card{
    overflow:hidden;border:1px solid #e5e0ed;border-radius:12px;
    background:#fff;transition:.2s
}
.card:hover{border-color:#7138d7;transform:translateY(-3px)}
.cover{
    width:100%;aspect-ratio:3/4;display:block;object-fit:cover;
    background:#f1edf8
}
.missing{
    width:100%;aspect-ratio:3/4;background:#f1edf8;color:#7138d7;
    display:flex;align-items:center;justify-content:center;
    text-align:center;padding:15px;font-weight:bold;direction:ltr
}
.info{padding:13px}
.info h2{font-size:17px;line-height:1.5;margin:0 0 10px}
.size{color:#7138d7;font-weight:bold;margin:8px 0}
.description{font-size:13px;color:#666;line-height:1.8}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.tag{background:#f1ebfc;color:#6132b5;padding:5px 8px;border-radius:5px;font-size:11px}
.details{
    width:100%;padding:10px;border:1px solid #7138d7;
    background:white;color:#7138d7;border-radius:7px;cursor:pointer
}
.details:hover{background:#7138d7;color:white}
.empty{text-align:center;padding:30px;color:#777}
footer{text-align:center;padding:25px;color:#777;border-top:1px solid #eee}
dialog{
    width:min(500px,90%);border:1px solid #ddd;border-radius:14px;
    padding:25px;max-height:85vh;overflow:auto
}
dialog::backdrop{background:#0009}
dialog h2{color:#7138d7}
dialog p{line-height:1.9;color:#555}
.close{
    padding:9px 18px;background:#7138d7;color:white;
    border:0;border-radius:7px;cursor:pointer
}
@media(max-width:850px){
    .games{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:550px){
    .games{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .categories{grid-template-columns:repeat(2,minmax(0,1fr))}
    .info{padding:9px}
    .info h2{font-size:14px}
}
@media(max-width:350px){
    .games{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
    <h1>ألعاب <span>PS4</span></h1>
    <p>اكتشف ألعابك المفضلة في FANTASY STORE</p>
    <a class="home" href="index.html">الصفحة الرئيسية</a>
</header>

<main class="container">

    <input class="search" id="search" type="search"
           placeholder="ابحث عن اسم اللعبة...">

    <div class="categories">
        <button class="category active" data-cat="all">كل الألعاب</button>
        <button class="category" data-cat="adventure">مغامرات</button>
        <button class="category" data-cat="horror">رعب</button>
        <button class="category" data-cat="action">أكشن</button>
        <button class="category" data-cat="story">قصص</button>
        <button class="category" data-cat="local">لعب محلي</button>
        <button class="category" data-cat="racing">سباقات</button>
        <button class="category" data-cat="sports">رياضة</button>
        <button class="category" data-cat="kids">أطفال</button>
    </div>

    <p class="count" id="count"></p>
    <section class="games" id="games"></section>
    <p class="empty" id="empty" hidden>لا توجد ألعاب مطابقة للبحث.</p>

</main>

<dialog id="detailsDialog">
    <h2 id="detailName"></h2>
    <p id="detailDescription"></p>
    <p id="detailSize"></p>
    <p id="detailPlayers"></p>
    <p id="detailInternet"></p>
    <button class="close" id="closeDialog">إغلاق</button>
</dialog>

<footer>FANTASY STORE © 2026</footer>

<script>
const gamesList = [
{
 name:"God of War Ragnarök",
 image:"images/god-of-war-ragnarok.jpg",
 size:"حوالي 90 جيجابايت",
 cat:["adventure","action","story"],
 players:"لاعب واحد",
 internet:"القصة يمكن لعبها دون إنترنت بعد التثبيت والتحديثات المطلوبة",
 desc:"رحلة كريتوس وأتريوس في العوالم الإسكندنافية، مع قتال واستكشاف وقصة قوية."
},
{
 name:"Uncharted 4: A Thief's End",
 image:"images/uncharted-4.jpg",
 size:"حوالي 60 جيجابايت",
 cat:["adventure","action","story"],
 players:"لاعب واحد في القصة",
 internet:"القصة تعمل دون إنترنت",
 desc:"مغامرة ناثان دريك للبحث عن كنز مفقود، مليئة بالألغاز والمطاردات."
},
{
 name:"The Last of Us Remastered",
 image:"images/the-last-of-us-remastered.jpg",
 size:"حوالي 50 جيجابايت",
 cat:["adventure","action","story"],
 players:"لاعب واحد في القصة",
 internet:"القصة تعمل دون إنترنت",
 desc:"رحلة بقاء مؤثرة تجمع بين الاستكشاف والتخفي والقتال."
},
{
 name:"Grand Theft Auto V",
image:"gta-v.jpg",
 size:"حوالي 90 جيجابايت",
 cat:["action","adventure"],
 players:"لاعب واحد في طور القصة",
 internet:"طور القصة يعمل دون إنترنت",
 desc:"عالم مفتوح واسع، ومهام متنوعة وقيادة واستكشاف مدينة لوس سانتوس."
},
{
 name:"Resident Evil 4",
 image:"images/resident-evil-4.jpg",
 size:"حوالي 60 جيجابايت",
 cat:["horror","action","adventure"],
 players:"لاعب واحد",
 internet:"القصة تعمل دون إنترنت",
 desc:"رعب وبقاء، يستكشف فيه ليون قرية غامضة لإنقاذ ابنة الرئيس."
},
{
 name:"Gran Turismo 7",
 image:"images/gran-turismo-7.jpg",
 size:"حوالي 110 جيجابايت",
 cat:["racing"],
 players:"أطوار فردية وجماعية حسب الوضع",
 internet:"تتطلب معظم أنماط اللعب اتصالًا بالإنترنت",
 desc:"سباقات سيارات واقعية مع مجموعة كبيرة من السيارات والحلبات."
},
{
 name:"EA SPORTS FC 24",
 image:"images/ea-sports-fc-24.jpg",
 size:"حوالي 45 جيجابايت",
 cat:["sports","local"],
 players:"اللعب المحلي متاح في أطوار مناسبة",
 internet:"بعض الأطوار تعمل دون إنترنت",
 desc:"كرة قدم وأندية وبطولات، مع إمكانية اللعب مع شخص آخر في الأطوار المدعومة."
},
{
 name:"Minecraft",
 image:"images/minecraft.jpg",
 size:"حوالي 2 جيجابايت",
 cat:["adventure","kids","local"],
 players:"اللعب المحلي متاح في أوضاع مدعومة",
 internet:"تتوفر ميزات دون إنترنت",
 desc:"بناء واستكشاف وصناعة عوالم خاصة بك، مع حرية كبيرة في اللعب."
},
{
 name:"Horizon Zero Dawn",
 image:"images/horizon-zero-dawn.jpg",
 size:"حوالي 50 جيجابايت",
 cat:["adventure","action","story"],
 players:"لاعب واحد",
 internet:"تعمل القصة دون إنترنت",
 desc:"مغامرة في عالم تحكمه آلات غريبة، مع استكشاف وأسرار وقتال."
},
{
 name:"Ghost of Tsushima",
 image:"images/ghost-of-tsushima.jpg",
 size:"حوالي 50 جيجابايت",
 cat:["adventure","action","story"],
 players:"لاعب واحد في القصة",
 internet:"القصة تعمل دون إنترنت",
 desc:"مغامرة ساموراي في جزيرة تسوشيما، تجمع بين القتال والاستكشاف."
},
{
 name:"Red Dead Redemption 2",
 image:"images/red-dead-redemption-2.jpg",
 size:"حوالي 100 جيجابايت",
 cat:["adventure","action","story"],
 players:"لاعب واحد في القصة",
 internet:"طور القصة يعمل دون إنترنت",
 desc:"قصة عالم مفتوح في الغرب الأمريكي، مع مهام وشخصيات وتفاصيل كثيرة."
},
{
 name:"Resident Evil 2",
 image:"images/resident-evil-2.jpg",
 size:"حوالي 30 جيجابايت",
 cat:["horror","action","story"],
 players:"لاعب واحد",
 internet:"القصة تعمل دون إنترنت",
 desc:"رعب وبقاء داخل مدينة موبوءة، مع ألغاز وموارد محدودة."
}
];

const labels = {
 adventure:"مغامرات",
 horror:"رعب",
 action:"أكشن",
 story:"قصص",
 local:"لعب محلي",
 racing:"سباقات",
 sports:"رياضة",
 kids:"أطفال"
};

const container = document.getElementById("games");
const search = document.getElementById("search");
const count = document.getElementById("count");
const empty = document.getElementById("empty");
let activeCategory = "all";

function renderGames(){
 const query = search.value.trim().toLowerCase();

 const filtered = gamesList.filter(game =>
   (activeCategory === "all" || game.cat.includes(activeCategory)) &&
   game.name.toLowerCase().includes(query)
 );

 container.innerHTML = "";

 filtered.forEach(game => {
   const card = document.createElement("article");
   card.className = "card";

   const img = document.createElement("img");
   img.className = "cover";
   img.src = game.image;
   img.alt = game.name;
   img.loading = "lazy";

   img.onerror = () => {
     const placeholder = document.createElement("div");
     placeholder.className = "missing";
     placeholder.textContent = game.name;
     placeholder.setAttribute("role","img");
     placeholder.setAttribute("aria-label",game.name);
     img.replaceWith(placeholder);
   };

   const info = document.createElement("div");
   info.className = "info";

   const title = document.createElement("h2");
   title.textContent = game.name;

   const size = document.createElement("p");
   size.className = "size";
   size.textContent = "المساحة: " + game.size;

   const desc = document.createElement("p");
   desc.className = "description";
   desc.textContent = game.desc;

   const tags = document.createElement("div");
   tags.className = "tags";

   game.cat.forEach(cat => {
     const tag = document.createElement("span");
     tag.className = "tag";
     tag.textContent = labels[cat];
     tags.appendChild(tag);
   });

   const button = document.createElement("button");
   button.className = "details";
   button.textContent = "عرض التفاصيل";

   button.onclick = () => {
     document.getElementById("detailName").textContent = game.name;
     document.getElementById("detailDescription").textContent = game.desc;
     document.getElementById("detailSize").textContent = "المساحة: " + game.size;
     document.getElementById("detailPlayers").textContent = "اللاعبون: " + game.players;
     document.getElementById("detailInternet").textContent = "الإنترنت: " + game.internet;
     document.getElementById("detailsDialog").showModal();
   };

   info.append(title,size,desc,tags,button);
   card.append(img,info);
   container.appendChild(card);
 });

 count.textContent = "عدد الألعاب: " + filtered.length;
 empty.hidden = filtered.length !== 0;
}

document.querySelectorAll(".category").forEach(button => {
 button.onclick = () => {
   activeCategory = button.dataset.cat;
   document.querySelectorAll(".category").forEach(b =>
     b.classList.toggle("active", b === button)
   );
   renderGames();
 };
});

search.addEventListener("input",renderGames);

document.getElementById("closeDialog").onclick = () =>
 document.getElementById("detailsDialog").close();

renderGames();
</script>

</body>
</html>
