<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090f">
  <title>FANTASY STORE | ألعاب PS4</title>

  <style>
    :root {
      --bg: #08090f;
      --panel: #121420;
      --panel2: #191b2b;
      --purple: #7546ff;
      --cyan: #35d9ff;
      --text: #f5f5ff;
      --muted: #a6a8bd;
      --border: #292b40;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Tahoma, Arial, sans-serif;
    }

    button, input {
      font: inherit;
    }

    header {
      padding: 30px 15px;
      text-align: center;
      background: linear-gradient(135deg, #21113d, #101522, #08090f);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      margin: 0;
      font-size: clamp(28px, 6vw, 44px);
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 0 0 20px #7546ff66;
    }

    .logo span {
      color: var(--purple);
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .top-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      padding: 11px 18px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel2);
      color: var(--text);
      cursor: pointer;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #7546ff, #5325d5);
      border-color: transparent;
      color: white;
      font-weight: bold;
    }

    .btn:hover {
      border-color: var(--purple);
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 25px 15px 45px;
    }

    .search {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      background: var(--panel);
      color: white;
    }

    .search:focus {
      border-color: var(--purple);
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 25px;
    }

    .category {
      padding: 9px 15px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--panel);
      color: var(--muted);
      cursor: pointer;
    }

    .category.active {
      color: white;
      background: #7546ff33;
      border-color: var(--purple);
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 21px;
    }

    .count {
      color: var(--cyan);
      font-size: 13px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px;
    }

    .empty-state {
      padding: 55px 15px;
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 14px;
      background: var(--panel);
    }

    .empty-icon {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .empty-state h3 {
      margin: 0 0 10px;
      font-size: 20px;
    }

    .empty-state p {
      margin: 0;
      color: var(--muted);
      line-height: 1.8;
      font-size: 14px;
    }

    footer {
      padding: 22px 15px;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .light-mode {
      --bg: #f4f3fa;
      --panel: #ffffff;
      --panel2: #eeeaf9;
      --text: #201833;
      --muted: #69647a;
      --border: #ded9ed;
    }

    .light-mode header {
      background: linear-gradient(135deg, #e7dcff, #f5f4ff);
    }

    .light-mode .search {
      color: #201833;
    }

    @media (max-width: 400px) {
      .games-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>

  <header>
    <h1 class="logo">FANTASY <span>STORE</span></h1>
    <p class="subtitle">مكتبة ألعاب PlayStation 4</p>

    <div class="top-actions">
      <a class="btn btn-primary" href="edit.html">⚙️ تعديل</a>
      <button class="btn" id="themeButton" type="button">
        ☀️ تغيير المظهر
      </button>
    </div>
  </header>

  <main>
    <input
      class="search"
      id="searchInput"
      type="search"
      placeholder="🔎 ابحث عن لعبة..."
      aria-label="البحث عن لعبة"
    >

    <nav class="categories" id="categories" aria-label="تصنيفات الألعاب">
      <button class="category active" data-category="all">كل الألعاب</button>
      <button class="category" data-category="action">أكشن</button>
      <button class="category" data-category="adventure">مغامرات</button>
      <button class="category" data-category="horror">رعب</button>
      <button class="category" data-category="sports">رياضة</button>
      <button class="category" data-category="racing">سباق</button>
      <button class="category" data-category="kids">أطفال</button>
    </nav>

    <div class="section-heading">
      <h2>🎮 مكتبة الألعاب</h2>
      <span class="count" id="gamesCount">0 لعبة</span>
    </div>

    <section class="games-grid" id="gamesList"></section>

    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🎮</div>
      <h3>مكتبة الألعاب فارغة</h3>
      <p>
        لم تتم إضافة أي ألعاب حتى الآن.<br>
        اضغط على «تعديل» لإضافة ألعاب جديدة إلى المكتبة.
      </p>
    </div>
  </main>

  <footer>
    FANTASY STORE © <span id="currentYear"></span>
  </footer>

  <script>
    "use strict";

    const storageKey = "fantasyStoreManagedGamesV1";

    const gamesList = document.getElementById("gamesList");
    const searchInput = document.getElementById("searchInput");
    const gamesCount = document.getElementById("gamesCount");
    const emptyState = document.getElementById("emptyState");

    let selectedCategory = "all";

    function loadGames() {
      try {
        const games = JSON.parse(localStorage.getItem(storageKey) || "[]");
        return Array.isArray(games) ? games : [];
      } catch {
        return [];
      }
    }

    function normalizeCategory(category) {
      const categories = {
        "أكشن": "action",
        "مغامرات": "adventure",
        "رعب": "horror",
        "رياضة": "sports",
        "سباق": "racing",
        "أطفال": "kids"
      };

      return categories[category] || category || "action";
    }

    function renderGames() {
      const searchTerm = searchInput.value.trim().toLowerCase();
      const games = loadGames();

      const filteredGames = games.filter(game => {
        if (!game || !game.name) return false;

        const matchesSearch = String(game.name)
          .toLowerCase()
          .includes(searchTerm);

        const category = normalizeCategory(game.category);
        const matchesCategory =
          selectedCategory === "all" ||
          category === selectedCategory;

        return matchesSearch && matchesCategory;
      });

      gamesList.replaceChildren();

      filteredGames.forEach(game => {
        const card = document.createElement("article");
        card.className = "game-card";

        if (game.image) {
          const image = document.createElement("img");
          image.src = game.image;
          image.alt = game.name;
          image.loading = "lazy";
          image.style.cssText =
            "width:100%;aspect-ratio:3/4;object-fit:cover;display:block;";

          image.addEventListener("error", () => {
            image.remove();
          });

          card.appendChild(image);
        }

        const info = document.createElement("div");
        info.style.cssText = "padding:12px;";

        const title = document.createElement("h3");
        title.textContent = game.name;
        title.style.cssText = "font-size:15px;line-height:1.7;";

        const size = document.createElement("p");
        size.textContent = `${game.size ?? "غير محدد"}${String(game.size ?? "").includes("جيجابايت") ? "" : " جيجابايت"}`;
        size.style.color = "#35d9ff";

        const details = document.createElement("button");
        details.className = "btn btn-primary";
        details.type = "button";
        details.textContent = "عرض التفاصيل";
        details.style.width = "100%";

        details.addEventListener("click", () => {
          const categoryNames = {
            action: "أكشن",
            adventure: "مغامرات",
            horror: "رعب",
            sports: "رياضة",
            racing: "سباق",
            kids: "أطفال"
          };

          const category = normalizeCategory(game.category);

          alert(
            "اسم اللعبة: " + game.name +
            "\nالمساحة: " + (game.size ?? "غير محدد") +
            "\nالتصنيف: " + (categoryNames[category] || category) +
            "\nعدد اللاعبين: " + (game.players || "غير محدد") +
            "\nالإنترنت: " + (game.internet || "غير محدد") +
            "\nالوصف: " + (game.description || "لا يوجد وصف")
          );
        });

        info.append(title, size, details);
        card.appendChild(info);
        gamesList.appendChild(card);
      });

      gamesCount.textContent = `${filteredGames.length} لعبة`;
      emptyState.style.display = filteredGames.length ? "none" : "block";
    }

    searchInput.addEventListener("input", renderGames);

    document.getElementById("categories").addEventListener("click", event => {
      const button = event.target.closest("[data-category]");
      if (!button) return;

      selectedCategory = button.dataset.category;

      document.querySelectorAll(".category").forEach(item => {
        item.classList.toggle("active", item === button);
      });

      renderGames();
    });

    document.getElementById("themeButton").addEventListener("click", () => {
      document.body.classList.toggle("light-mode");

      localStorage.setItem(
        "fantasyStoreLightMode",
        document.body.classList.contains("light-mode") ? "on" : "off"
      );
    });

    if (localStorage.getItem("fantasyStoreLightMode") === "on") {
      document.body.classList.add("light-mode");
    }

    document.getElementById("currentYear").textContent =
      new Date().getFullYear();

    window.addEventListener("storage", event => {
      if (event.key === storageKey) renderGames();
    });

    renderGames();
  </script>

</body>
</html>
