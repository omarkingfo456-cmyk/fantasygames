<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ألعاب PS4 | FANTASY STORE</title>
<style>
:root {
  --bg:#08090f;
  --panel:#121420;
  --border:#272a3d;
  --purple:#7546ff;
  --text:#f5f5ff;
  --muted:#a5a7bd;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Tahoma,sans-serif;
}
header {
  text-align:center;
  padding:30px 16px 24px;
  background:linear-gradient(135deg,#111027,#08090f 75%);
  border-bottom:1px solid var(--border);
}
.logo {
  font-size:30px;
  font-weight:900;
  color:#a88aff;
  letter-spacing:2px;
}
header h1 {margin:12px 0 7px;font-size:25px}
header p {color:var(--muted);margin:0 0 20px}
.home {
  display:inline-block;
  color:white;
  text-decoration:none;
  border:1px solid #51417d;
  padding:10px 22px;
  border-radius:9px;
}
.container {max-width:1250px;margin:auto;padding:22px 16px}
.search {
  width:100%;
  padding:15px;
  background:var(--panel);
  color:white;
  border:1px solid var(--border);
  border-radius:12px;
  outline:none;
  font-size:16px;
  margin-bottom:18px;
}
.categories {
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-bottom:22px;
}
.categories button {
  flex:1 1 100px;
  background:var(--panel);
  border:1px solid var(--border);
  color:white;
  padding:12px 9px;
  border-radius:9px;
  cursor:pointer;
}
.categories button.active,
.categories button:hover {
  background:var(--purple);
  border-color:var(--purple);
}
.grid {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:17px;
}
.card {
  min-width:0;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:13px;
  overflow:hidden;
  transition:transform .2s,border-color .2s;
}
.card:hover {transform:translateY(-4px);border-color:var(--purple)}
.cover {
  width:100%;
  aspect-ratio:3/4;
  display:block;
  object-fit:cover;
  background:#202235;
}
.no-image {
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:15px;
  color:#b7a5ff;
  font-size:20px;
  font-weight:bold;
  aspect-ratio:3/4;
  background:linear-gradient(145deg,#22203b,#10121d);
}
.card-content {padding:13px}
.card h3 {font-size:16px;margin:0 0 12px;line-height:1.6}
.info {font-size:13px;color:var(--muted);line-height:1.9}
.tag {
  display:inline-block;
  color:#c5b4ff;
  background:#292044;
  border-radius:6px;
  padding:4px 7px;
  margin-top:8px;
  font-size:12px;
}
.details {
  width:100%;
  margin-top:12px;
  background:var(--purple);
  color:white;
  border:0;
  border-radius:8px;
  padding:11px 8px;
  font-size:14px;
  cursor:pointer;
}
.empty {grid-column:1/-1;text-align:center;color:var(--muted);padding:35px}
footer {
  text-align:center;
  padding:25px 10px;
  color:var(--muted);
  border-top:1px solid var(--border);
  margin-top:25px;
}
dialog {
  background:#141522;
  color:white;
  border:1px solid #39334f;
  border-radius:14px;
  max-width:500px;
  width:calc(100% - 28px);
  padding:22px;
}
dialog::backdrop {background:#000c}
dialog h2 {color:#b8a0ff}
dialog p {line-height:1.9;color:#ddd}
.close {
  background:#39334f;
  color:white;
  border:0;
  border-radius:8px;
  padding:10px 20px;
  cursor:pointer;
}
@media(max-width:900px) {
  .grid {grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:600px) {
  .grid {grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card-content {padding:10px}
  .card h3 {font-size:14px}
  .logo {font-size:25px}
  header h1 {font-size:22px}
}
@media(max-width:350px) {
  .grid {grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>

<main class="container">
  <input id="search" class="search" type="search"

  <nav class="categories" id="categories">

    <button data-cat="family">أطفال وعائلة</button>

  <section class="grid" id="gamesList"></section>
</main>

<dialog id="gameDialog">
  <h2 id="dialogTitle"></h2>
  <div id="dialogInfo"></div>
  <p id="dialogDesc"></p>
  <button class="close" id="closeDialog">إغلاق</button>

const list = document.getElementById("gamesList");
const search = document.getElementById("search");
let activeCat = "all";

const categoryNames = {
  action:"أكشن",
  adventure:"مغامرات",
  horror:"رعب",
  sports:"رياضة",
  fighting:"قتال",
  family:"أطفال وعائلة"
};

function renderGames() {
  const term = search.value.trim().toLowerCase();
  const filtered = games.filter(game => {
    const matchesText = game.name.toLowerCase().includes(term);
    const matchesCat = activeCat === "all" || game.cat.includes(activeCat);
    return matchesText && matchesCat;
  });

  list.innerHTML = "";

  if (!filtered.length) {
    list.innerHTML = '<div class="empty">مفيش ألعاب مطابقة للبحث.</div>';
    return;
  }

  filtered.forEach(game => {
    const card = document.createElement("article");
    card.className = "card";

    const img = document.createElement("img");
    img.className = "cover";
    img.src = game.image;
    img.alt = game.name;
    img.loading = "lazy";
    img.onerror = () => {
      const fallback = document.createElement("div");
      fallback.className = "no-image";
      fallback.textContent = game.name;
      img.replaceWith(fallback);
    };

    const content = document.createElement("div");
    content.className = "card-content";

    const title = document.createElement("h3");
    title.textContent = game.name;

    const info = document.createElement("div");
    info.className = "info";
    info.textContent = "المساحة: " + game.size;

    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = categoryNames[game.cat[0]] || "ألعاب PS4";

    const btn = document.createElement("button");
    btn.className = "details";
    btn.textContent = "عرض التفاصيل";
    btn.addEventListener("click", () => showDetails(game));

    content.append(title, info, tag, btn);
    card.append(img, content);
    list.append(card);
  });
}

function showDetails(game) {
  document.getElementById("dialogTitle").textContent = game.name;
  const info = document.getElementById("dialogInfo");
  info.replaceChildren();

  [
    "المساحة: " + game.size,
    "عدد اللاعبين: " + game.players,
    "الإنترنت: " + game.internet,
    "التصنيف: " + game.cat.map(c => categoryNames[c] || c).join("، ")
  ].forEach(line => {
    const p = document.createElement("p");
    p.textContent = line;
    info.append(p);
  });

  document.getElementById("dialogDesc").textContent = game.desc;
  document.getElementById("gameDialog").showModal();
}

document.getElementById("closeDialog").addEventListener("click", () => {
  document.getElementById("gameDialog").close();
});

search.addEventListener("input", renderGames);

document.getElementById("categories").addEventListener("click", event => {
  const button = event.target.closest("button[data-cat]");
  if (!button) return;
  activeCat = button.dataset.cat;
  document.querySelectorAll(".categories button").forEach(b => {
    b.classList.toggle("active", b === button);
  });
  renderGames();
});

renderGames();
</script>
