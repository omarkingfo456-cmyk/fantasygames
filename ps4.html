<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FANTASY STORE | ألعاب PS4</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080812;color:#fff;font-family:Arial,Tahoma,sans-serif}
header{text-align:center;padding:25px 12px;background:#111120;border-bottom:1px solid #39304f}
header h1{margin:0;color:#c59aff;font-size:29px}
header p{color:#bbb;margin-bottom:0}
main{width:min(1100px,94%);margin:24px auto}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
input,select{padding:12px;border:1px solid #403754;border-radius:9px;background:#131323;color:white;font-size:15px}
#search{flex:1;min-width:160px}
.button{display:inline-block;text-decoration:none;padding:12px 16px;border-radius:9px;background:#b486ff;color:#160c27;font-weight:bold}
#count{color:#c59aff}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:17px}
.card{overflow:hidden;background:#131323;border:1px solid #342d4b;border-radius:13px}
.cover{width:100%;height:250px;object-fit:cover;display:block;background:#202033}
.info{padding:14px}
.info h2{font-size:18px;color:#d4b7ff;margin:0 0 10px}
.size{color:#c59aff;font-weight:bold}
.category{color:#aaa;margin:8px 0}
.description{font-size:14px;color:#ddd;line-height:1.7}
.empty{grid-column:1/-1;text-align:center;padding:35px 12px;color:#ccc;border:1px dashed #51436f;border-radius:12px;line-height:1.8}
footer{text-align:center;padding:25px;color:#888;font-size:13px}
@media(max-width:480px){
 header h1{font-size:24px}
 .games{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .cover{height:190px}
 .info{padding:10px}
 .info h2{font-size:15px}
 .description{font-size:13px}
}
</style>
</head>
<body>
<header>
  <h1>FANTASY STORE</h1>
  <p>مكتبة ألعاب PlayStation 4</p>
</header>

<main>
  <div class="controls">
    <input id="search" type="search" placeholder="ابحث عن لعبة...">
    <select id="category">
      <option value="">كل التصنيفات</option>
      <option>أكشن</option>
      <option>مغامرات</option>
      <option>رعب</option>
      <option>أطفال</option>
      <option>رياضة</option>
      <option>سباقات</option>
    </select>
    <a class="button" href="edit.html">إدارة الألعاب</a>
  </div>

  <p id="count"></p>
  <section class="games" id="games"></section>
</main>

<footer>FANTASY STORE — PS4 GAMES</footer>

<script>
const KEY = "fantasyStoreManagedGamesV1";

/* ألعاب تجريبية تظهر عند كل الزوار */
const defaultGames = [
  {
    id:"demo-gow",
    name:"God of War Ragnarök",
    size:"نحو 84 GB",
    category:"أكشن",
    description:"مغامرة ملحمية مع كريتوس وأتريوس في العوالم الإسكندنافية.",
    image:"https://image.api.playstation.com/vulcan/ap/rnd/202207/1117/0uY6H6XwW7WvN4Xh2n6n7JQ0.png"
  },
  {
    id:"demo-uncharted",
    name:"Uncharted 4: A Thief's End",
    size:"نحو 50 GB",
    category:"مغامرات",
    description:"مغامرة ناثان دريك للبحث عن كنز أسطوري.",
    image:"https://image.api.playstation.com/cdn/UP9000/CUSA00341_00/9u1mY1q6x8p8p4m0.png"
  },
  {
    id:"demo-rdr2",
    name:"Red Dead Redemption 2",
    size:"نحو 100 GB",
    category:"مغامرات",
    description:"قصة آرثر مورجان في عالم مفتوح في الغرب الأمريكي.",
    image:"https://images.igdb.com/igdb/image/upload/t_cover_big/co1q1f.jpg"
  }
];

function readGames(){
  try{
    const stored=JSON.parse(localStorage.getItem(KEY)||"[]");
    return Array.isArray(stored)?stored:[];
  }catch(e){return []}
}

function getAllGames(){
  const stored=readGames();
  const ids=new Set(stored.map(g=>g.id));
  return [...defaultGames.filter(g=>!ids.has(g.id)),...stored];
}

function make(tag,cls,text){
  const el=document.createElement(tag);
  if(cls)el.className=cls;
  el.textContent=text||"";
  return el;
}

function render(){
  const all=getAllGames();
  const q=document.getElementById("search").value.trim().toLowerCase();
  const cat=document.getElementById("category").value;
  const filtered=all.filter(g=>
    ((g.name||"").toLowerCase().includes(q)||
     (g.description||"").toLowerCase().includes(q))&&
    (!cat||g.category===cat)
  );

  const root=document.getElementById("games");
  root.replaceChildren();
  document.getElementById("count").textContent="عدد الألعاب: "+filtered.length;

  if(!filtered.length){
    root.appendChild(make("div","empty","لا توجد ألعاب مطابقة للبحث."));
    return;
  }

  filtered.forEach(g=>{
    const card=make("article","card","");
    if(g.image){
      const img=document.createElement("img");
      img.className="cover";
      img.src=g.image;
      img.alt=g.name;
      img.loading="lazy";
      img.onerror=()=>{img.replaceWith(make("div","cover empty","الصورة غير متاحة"))};
      card.appendChild(img);
    }else{
      card.appendChild(make("div","cover empty","لا توجد صورة"));
    }

    const info=make("div","info","");
    info.appendChild(make("h2","",g.name));
    info.appendChild(make("div","size","الحجم: "+(g.size||"غير محدد")));
    info.appendChild(make("div","category","التصنيف: "+(g.category||"أخرى")));
    info.appendChild(make("p","description",g.description||""));
    card.appendChild(info);
    root.appendChild(card);
  });
}

document.getElementById("search").addEventListener("input",render);
document.getElementById("category").addEventListener("change",render);
render();
</script>
</body>
</html>
