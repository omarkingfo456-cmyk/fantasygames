<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فانتازي ستور PS4</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0a0e16;
  --bg2:#0f1420;
  --card:#10151f;
  --ink:#eef1f6;
  --muted:#8b93a7;
  --cyan:#00d9ff;
  --blue:#0057d9;
  --violet:#7b2ff7;
  --line:rgba(255,255,255,.08);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Tajawal',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

/* =========================
   الصفحة الرئيسية
========================= */

.hero{
  position:relative;
  min-height:100svh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:32px 20px;
  background:
    radial-gradient(60% 50% at 50% 12%,rgba(0,87,217,.35),transparent 70%),
    radial-gradient(45% 40% at 85% 85%,rgba(123,47,247,.22),transparent 70%),
    var(--bg);
  overflow:hidden;
}

.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:radial-gradient(60% 60% at 50% 40%,black,transparent 80%);
  pointer-events:none;
}

.glow-orb{
  position:absolute;
  width:520px;
  height:520px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(0,217,255,.18),transparent 65%);
  top:-160px;
  right:-160px;
  filter:blur(10px);
  pointer-events:none;
}

.tag{
  position:relative;
  font-family:'Cairo',sans-serif;
  font-weight:700;
  font-size:13px;
  color:var(--cyan);
  background:rgba(0,217,255,.08);
  border:1px solid rgba(0,217,255,.35);
  padding:7px 18px;
  border-radius:999px;
  margin-bottom:28px;
}

.store-name{
  position:relative;
  font-family:'Cairo',sans-serif;
  font-weight:900;
  font-size:clamp(40px,9vw,92px);
  line-height:1.08;
  background:linear-gradient(90deg,#fff 20%,var(--cyan) 60%,var(--blue) 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  max-width:14ch;
  text-shadow:0 0 60px rgba(0,217,255,.25);
}

.store-sub{
  position:relative;
  font-size:clamp(16px,2.4vw,20px);
  color:var(--muted);
  margin-top:20px;
  max-width:36ch;
  line-height:1.7;
}

.cta-wrap{
  position:relative;
  margin-top:46px;
}

.cta-btn{
  font-family:'Cairo',sans-serif;
  font-weight:700;
  font-size:18px;
  color:#04101c;
  background:linear-gradient(95deg,var(--cyan),#3ea6ff);
  border:none;
  padding:18px 44px;
  border-radius:14px;
  cursor:pointer;
  box-shadow:0 10px 40px rgba(0,217,255,.35);
  transition:.25s;
}

.cta-btn:hover{
  transform:translateY(-3px);
  box-shadow:0 14px 50px rgba(0,217,255,.5);
}

/* =========================
   الصفحات
========================= */

.page{
  min-height:100svh;
}

.hidden{
  display:none !important;
}

/* =========================
   رأس الصفحات
========================= */

.content{
  padding:60px 6vw 100px;
  background:var(--bg2);
  min-height:100svh;
}

.top-bar{
  max-width:1200px;
  margin:0 auto 35px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.back-btn{
  display:inline-flex;
  align-items:center;
  gap:7px;
  font-family:'Cairo',sans-serif;
  font-size:14px;
  font-weight:700;
  color:var(--muted);
  background:rgba(255,255,255,.04);
  border:1px solid var(--line);
  padding:10px 16px;
  border-radius:10px;
  cursor:pointer;
  transition:.2s;
}

.back-btn:hover{
  color:var(--cyan);
  border-color:rgba(0,217,255,.4);
}

.page-title{
  max-width:1200px;
  margin:0 auto 40px;
}

.page-title h2{
  font-family:'Cairo',sans-serif;
  font-weight:900;
  font-size:clamp(27px,4vw,40px);
}

.page-title p{
  color:var(--muted);
  margin-top:9px;
  line-height:1.8;
}

/* =========================
   التصنيفات
========================= */

.categories-grid{
  max-width:1200px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.category-card{
  position:relative;
  min-height:150px;
  background:
    radial-gradient(circle at 20% 20%,rgba(0,217,255,.12),transparent 50%),
    var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:25px;
  cursor:pointer;
  overflow:hidden;
  transition:.25s;
}

.category-card:hover{
  transform:translateY(-5px);
  border-color:rgba(0,217,255,.5);
  box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.category-icon{
  font-size:42px;
  margin-bottom:12px;
}

.category-card h3{
  font-family:'Cairo',sans-serif;
  font-size:20px;
}

.category-card span{
  color:var(--muted);
  font-size:13px;
  display:block;
  margin-top:5px;
}

/* =========================
   صفحة الألعاب
========================= */

.games-grid{
  max-width:1200px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:22px;
}

.game-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  transition:.25s;
}

.game-card:hover{
  transform:translateY(-4px);
  border-color:rgba(0,217,255,.45);
}

.game-cover{
  position:relative;
  aspect-ratio:3/4;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.game-cover img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.cover-placeholder{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
  font-family:'Cairo',sans-serif;
  font-size:24px;
  font-weight:900;
}

.ps4-badge{
  position:absolute;
  top:10px;
  right:10px;
  background:rgba(0,0,0,.65);
  border:1px solid rgba(255,255,255,.2);
  padding:5px 10px;
  border-radius:8px;
  font-family:'Cairo',sans-serif;
  font-size:11px;
}

.game-info{
  padding:16px;
}

.game-info h3{
  font-family:'Cairo',sans-serif;
  font-size:17px;
  margin-bottom:7px;
}

.game-info p{
  color:var(--muted);
  font-size:13px;
  line-height:1.7;
  min-height:45px;
}

.game-details{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin-top:12px;
  font-size:12px;
}

.game-size{
  color:var(--cyan);
}

.whatsapp-btn{
  width:100%;
  margin-top:13px;
  padding:10px;
  border-radius:9px;
  border:1px solid var(--line);
  background:rgba(0,217,255,.08);
  color:var(--ink);
  font-family:'Cairo',sans-serif;
  font-weight:700;
  cursor:pointer;
}

.whatsapp-btn:hover{
  background:rgba(0,217,255,.16);
}

.empty{
  max-width:600px;
  margin:50px auto;
  text-align:center;
  color:var(--muted);
  padding:40px;
  border:1px dashed var(--line);
  border-radius:16px;
}

/* =========================
   موبايل
========================= */

@media(max-width:600px){

  .content{
    padding:35px 18px 70px;
  }

  .categories-grid{
    grid-template-columns:1fr 1fr;
    gap:13px;
  }

  .category-card{
    min-height:135px;
    padding:17px;
  }

  .category-icon{
    font-size:32px;
  }

  .category-card h3{
    font-size:16px;
  }

  .games-grid{
    grid-template-columns:1fr 1fr;
    gap:13px;
  }

  .game-info{
    padding:11px;
  }

  .game-info h3{
    font-size:14px;
  }

  .game-info p{
    font-size:11px;
  }

  .cta-btn{
    font-size:16px;
    padding:16px 28px;
  }
}
</style>
</head>

<body>

<!-- =========================
     الصفحة الرئيسية
========================= -->

<section class="hero page" id="homePage">

  <div class="glow-orb"></div>

  <span class="tag">
    PS4 · كتالوج الألعاب
  </span>

  <h1 class="store-name">
    فانتازي ستور PS4
  </h1>

  <p class="store-sub">
    اختار تصنيف اللعبة وشوف الألعاب المتوفرة عندنا.
  </p>

  <div class="cta-wrap">
    <button class="cta-btn" onclick="openCategories()">
      اضغط هنا لرؤية الألعاب
    </button>
  </div>

</section>


<!-- =========================
     صفحة التصنيفات
========================= -->

<section class="content page hidden" id="categoriesPage">

  <div class="top-bar">

    <button class="back-btn" onclick="goHome()">
      ← الصفحة الرئيسية
    </button>

  </div>

  <div class="page-title">
    <h2>تصنيفات ألعاب PS4 🎮</h2>
    <p>
      اختار القسم اللي عايز تشوف الألعاب الموجودة فيه.
    </p>
  </div>

  <div class="categories-grid" id="categoriesGrid"></div>

</section>


<!-- =========================
     صفحة الألعاب
========================= -->

<section class="content page hidden" id="gamesPage">

  <div class="top-bar">

    <button class="back-btn" onclick="backToCategories()">
      → رجوع للتصنيفات
    </button>

  </div>

  <div class="page-title">
    <h2 id="gamesTitle"></h2>
    <p id="gamesDescription"></p>
  </div>

  <div class="games-grid" id="gamesGrid"></div>

</section>


<script>

/* =====================================================
   رقم واتساب
   غيّر الرقم هنا إلى رقمك
   مثال مصر:
   201012345678
===================================================== */

const WHATSAPP_NUMBER = "201000000000";


/* =====================================================
   التصنيفات
===================================================== */

const categories = [

  {
    id:"action",
    name:"أكشن",
    icon:"🎯",
    description:"ألعاب مليانة حركة وتحديات"
  },

  {
    id:"adventure",
    name:"مغامرات",
    icon:"🗺️",
    description:"استكشاف وقصص ومغامرات"
  },

  {
    id:"horror",
    name:"رعب",
    icon:"👻",
    description:"ألعاب الرعب والإثارة"
  },

  {
    id:"kids",
    name:"أطفال",
    icon:"👶",
    description:"ألعاب مناسبة للأطفال والعائلة"
  },

  {
    id:"sports",
    name:"رياضة",
    icon:"⚽",
    description:"كرة قدم ورياضات مختلفة"
  },

  {
    id:"racing",
    name:"سباق",
    icon:"🏎️",
    description:"سيارات وسباقات"
  },

  {
    id:"fighting",
    name:"قتال",
    icon:"🥊",
    description:"ألعاب القتال والمواجهات"
  },

  {
    id:"shooting",
    name:"تصويب",
    icon:"🔫",
    description:"ألعاب التصويب"
  },

  {
    id:"local",
    name:"لاعبين محليًا",
    icon:"👥",
    description:"ألعاب تلعبها مع شخص بجانبك"
  }

];


/* =====================================================
   الألعاب
   لإضافة لعبة:
   انسخ لعبة وعدل البيانات
===================================================== */

const games = [

  {
    name:"God of War",
    category:"action",
    size:"45 GB",
    description:"أكشن ومغامرات",
image:"images/god-of-war.jpg"
  },

  {
    name:"Uncharted 4",
    category:"adventure",
    size:"55 GB",
    description:"مغامرات واستكشاف",
    image:""
  },

  {
    name:"Resident Evil",
    category:"horror",
    size:"25 GB",
    description:"رعب وبقاء",
    image:""
  },

  {
    name:"Crash Bandicoot",
    category:"kids",
    size:"20 GB",
    description:"مغامرات مناسبة للعائلة",
    image:""
  },

  {
    name:"EA Sports FC",
    category:"sports",
    size:"50 GB",
    description:"كرة قدم",
    image:""
  },

  {
    name:"Need for Speed",
    category:"racing",
    size:"30 GB",
    description:"سباقات سيارات",
    image:""
  },

  {
    name:"Mortal Kombat",
    category:"fighting",
    size:"40 GB",
    description:"قتال",
    image:""
  },

  {
    name:"Call of Duty",
    category:"shooting",
    size:"80 GB",
    description:"تصويب وحركة",
    image:""
  },

  {
    name:"It Takes Two",
    category:"local",
    size:"45 GB",
    description:"لعب تعاوني لشخصين",
    image:""
  }

];


/* =====================================================
   عناصر الصفحات
===================================================== */

const homePage = document.getElementById("homePage");
const categoriesPage = document.getElementById("categoriesPage");
const gamesPage = document.getElementById("gamesPage");

const categoriesGrid = document.getElementById("categoriesGrid");
const gamesGrid = document.getElementById("gamesGrid");

const gamesTitle = document.getElementById("gamesTitle");
const gamesDescription = document.getElementById("gamesDescription");


/* =====================================================
   فتح التصنيفات
===================================================== */

function openCategories(){

  homePage.classList.add("hidden");
  gamesPage.classList.add("hidden");
  categoriesPage.classList.remove("hidden");

  window.scrollTo(0,0);
}


/* =====================================================
   الرجوع للرئيسية
===================================================== */

function goHome(){

  categoriesPage.classList.add("hidden");
  gamesPage.classList.add("hidden");
  homePage.classList.remove("hidden");

  window.scrollTo(0,0);
}


/* =====================================================
   الرجوع للتصنيفات
===================================================== */

function backToCategories(){

  gamesPage.classList.add("hidden");
  categoriesPage.classList.remove("hidden");

  window.scrollTo(0,0);
}


/* =====================================================
   رسم التصنيفات
===================================================== */

function renderCategories(){

  categoriesGrid.innerHTML = "";

  categories.forEach(category => {

    const count = games.filter(
      game => game.category === category.id
    ).length;

    const card = document.createElement("div");

    card.className = "category-card";

    card.innerHTML = `
      <div class="category-icon">${category.icon}</div>

      <h3>${category.name}</h3>

      <span>
        ${category.description}
      </span>

      <span>
        ${count} ألعاب
      </span>
    `;

    card.addEventListener("click", () => {

      openCategory(category);

    });

    categoriesGrid.appendChild(card);

  });

}


/* =====================================================
   فتح تصنيف معين
===================================================== */

function openCategory(category){

  categoriesPage.classList.add("hidden");
  gamesPage.classList.remove("hidden");

  gamesTitle.textContent =
    category.icon + " ألعاب " + category.name;

  gamesDescription.textContent =
    category.description;

  renderGames(category.id);

  window.scrollTo(0,0);
}


/* =====================================================
   رسم الألعاب
===================================================== */

function renderGames(categoryId){

  gamesGrid.innerHTML = "";

  const filteredGames = games.filter(
    game => game.category === categoryId
  );

  if(filteredGames.length === 0){

    gamesGrid.innerHTML = `
      <div class="empty">
        لا توجد ألعاب مضافة في هذا التصنيف حاليًا.
      </div>
    `;

    return;
  }


  filteredGames.forEach((game,index) => {

    const card = document.createElement("div");

    card.className = "game-card";


    let coverHTML = "";

    if(game.image){

      coverHTML = `
        <img
          src="${game.image}"
          alt="${game.name}"
        >
      `;

    }else{

      coverHTML = `
        <div class="cover-placeholder"
             style="background:
             linear-gradient(145deg,#7b2ff7,#07152e);">

          ${game.name}

        </div>
      `;

    }


    card.innerHTML = `

      <div class="game-cover">

        ${coverHTML}

        <span class="ps4-badge">
          PS4
        </span>

      </div>


      <div class="game-info">

        <h3>
          ${game.name}
        </h3>

        <p>
          ${game.description}
        </p>


        <div class="game-details">

          <span>
            🎮 PS4
          </span>

          <span class="game-size">
            💾 ${game.size}
          </span>

        </div>


        <button class="whatsapp-btn">
          اسأل عنها على واتساب
        </button>

      </div>

    `;


    card
      .querySelector(".whatsapp-btn")
      .addEventListener("click", () => {

        const message =
          `عايز أسأل عن لعبة ${game.name} على PS4`;

        const url =
          `https://wa.me/${WHATSAPP_NUMBER}?text=${
            encodeURIComponent(message)
          }`;

        window.open(url,"_blank");

      });


    gamesGrid.appendChild(card);

  });

}


/* =====================================================
   تشغيل التصنيفات عند فتح الموقع
===================================================== */

renderCategories();

</script>

</body>
</html>
