 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ألعاب فانتازي ستور | FANTASY STORE</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #000;
            color: #fff;
            font-family: Arial, Tahoma, sans-serif;
            min-height: 100vh;
            text-align: center;
        }

        header {
            padding: 55px 15px 20px;
        }

        header h1 {
            font-size: clamp(28px, 5vw, 46px);
            font-weight: bold;
            margin-bottom: 12px;
        }

        header p {
            font-size: 17px;
            color: #ccc;
            letter-spacing: 1px;
        }

        .main {
            padding: 30px 20px 60px;
        }

        .section-title {
            font-size: 23px;
            margin-bottom: 35px;
        }

        .platforms {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 25px;
            max-width: 700px;
            margin: 0 auto;
        }

        .platform {
            width: 230px;
            min-height: 155px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #fff;
            border-radius: 14px;
            color: #fff;
            text-decoration: none;
            background: #000;
            transition: 0.25s ease;
        }

        .platform span {
            font-size: 42px;
            font-weight: bold;
            direction: ltr;
        }

        .platform:hover {
            background: #fff;
            color: #000;
            transform: translateY(-5px);
        }

        footer {
            padding: 20px;
            color: #777;
            font-size: 13px;
        }

        @media (max-width: 520px) {
            header {
                padding-top: 40px;
            }

            .platform {
                width: min(100%, 300px);
                min-height: 125px;
            }

            .section-title {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>ألعاب فانتازي ستور</h1>
        <p>FANTASY STORE</p>
    </header>

    <main class="main">
        <h2 class="section-title">اضغط هنا للمزيد من الألعاب</h2>

        <div class="platforms">

            <a class="platform" href="ps4.html">
                <span>PS4</span>
            </a>

            <a class="platform" href="ps5.html">
                <span>PS5</span>
            </a>

        </div>
    </main>

    <footer>
        FANTASY STORE © 2026
    </footer>

</body>
</html>
