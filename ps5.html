<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FANTASY STORE | ألعاب PS5</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#080812;color:#fff;font-family:Arial,Tahoma,sans-serif;transition:.2s}
header{text-align:center;padding:25px 12px;background:#111120;border-bottom:1px solid #39304f}
header h1{margin:0;color:#c59aff;font-size:29px}
header p{color:#bbb;margin-bottom:0}
main{width:min(1100px,94%);margin:24px auto}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
input,select{padding:12px;border:1px solid #403754;border-radius:9px;background:#131323;color:inherit;font-size:15px}
#search{flex:1;min-width:160px}
.button{display:inline-block;text-decoration:none;padding:12px 16px;border-radius:9px;background:#b486ff;color:#160c27;font-weight:bold;border:0;cursor:pointer}
#count{color:#c59aff}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:17px}
.card{overflow:hidden;background:#131323;border:1px solid #342d4b;border-radius:13px}
.cover{width:100%;height:250px;object-fit:cover;display:block;background:#202033}
.info{padding:14px}
.info h2{font-size:18px;color:#d4b7ff;margin:0 0 10px}
.size{color:#c59aff;font-weight:bold}
.category,.players{color:#aaa;margin:8px 0}
.description{font-size:14px;color:#ddd;line-height:1.7;white-space:pre-wrap}
.empty{grid-column:1/-1;text-align:center;padding:35px 12px;color:#ccc;border:1px dashed #51436f;border-radius:12px;line-height:1.8}
footer{text-align:center;padding:25px;color:#888;font-size:13px}
.video-btn{display:block;margin-top:12px;padding:10px;border-radius:9px;background:#ff3d3d;color:#fff;text-align:center;text-decoration:none;font-weight:bold;font-size:14px}
.video-btn:hover{background:#e02b2b}

body.light{background:#f4f3f8;color:#171323}
body.light header{background:#fff;border-color:#ddd}
body.light header p{color:#555}
body.light input,body.light select{background:#fff;color:#171323;border-color:#ccc}
body.light .card{background:#fff;border-color:#ddd}
body.light .info h2{color:#6034a1}
body.light .category,body.light .players,body.light .description{color:#444}
body.light footer{color:#555}
body.light .empty{color:#444;border-color:#bbb}

@media(max-width:480px){
header h1{font-size:24px}
.games{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cover{height:190px}
.info{padding:10px}
.info h2{font-size:15px}
.description{font-size:13px}
}
</style>
</head>

<body>
<header>
<h1>FANTASY STORE</h1>
<p>مكتبة ألعاب PlayStation 5</p>
</header>

<main>
<div class="controls">
<input id="search" type="search" placeholder="ابحث عن لعبة...">

<select id="category">
<option value="">كل التصنيفات</option>
<option>أكشن</option>
<option>مغامرات</option>
<option>رعب</option>
<option>أطفال</option>
<option>رياضة</option>
<option>سباقات</option>
<option>ألعاب محلية</option>
<option>أخرى</option>
</select>

<button class="button" id="themeBtn" type="button">☀️ الوضع الفاتح</button>
<a class="button" href="index.html">الرئيسية</a>
<a class="button" href="edit5.html">إدارة الألعاب</a>
</div>

<p id="count"></p>
<section class="games" id="games"></section>
</main>

<footer>FANTASY STORE — PS5 GAMES</footer>

<script type="module">
import { db } from "./firebase.js";
import { collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const THEME_KEY="fantasyStoreThemeV1";

const defaultGames=[];

let savedGames=null; // null = لسه بيحمّل

function $(id){
return document.getElementById(id);
}

function getAllGames(){
if(savedGames===null)return [];
return savedGames.length?savedGames:defaultGames;
}

function isYouTubeUrl(value){
try{
const url=new URL(value);
return url.protocol==="https:"&&["youtube.com","www.youtube.com","m.youtube.com","youtu.be"].includes(url.hostname);
}catch(e){
return false;
}
}

function make(tag,cls,text){
const el=document.createElement(tag);
if(cls)el.className=cls;
el.textContent=text||"";
return el;
}

function applyTheme(){
const light=localStorage.getItem(THEME_KEY)==="light";
document.body.classList.toggle("light",light);
$("themeBtn").textContent=light?"🌙 الوضع الداكن":"☀️ الوضع الفاتح";
}

$("themeBtn").addEventListener("click",()=>{
const light=document.body.classList.contains("light");
localStorage.setItem(THEME_KEY,light?"dark":"light");
applyTheme();
});

function render(){
const all=getAllGames();
const q=$("search").value.trim().toLowerCase();
const cat=$("category").value;

const filtered=all.filter(g=>
((g.name||"").toLowerCase().includes(q)||
(g.description||"").toLowerCase().includes(q))&&
(!cat||g.category===cat)
);

const root=$("games");
root.replaceChildren();

if(savedGames===null){
$("count").textContent="";
root.appendChild(make("div","empty","جاري تحميل الألعاب..."));
return;
}

$("count").textContent="عدد الألعاب: "+filtered.length;

if(!filtered.length){
root.appendChild(make("div","empty",all.length?"لا توجد ألعاب مطابقة للبحث.":"لا توجد ألعاب PS5 حاليًا."));
return;
}

filtered.forEach(g=>{
const card=make("article","card","");

if(g.image){
const img=document.createElement("img");
img.className="cover";
img.src=g.image;
img.alt=g.name||"غلاف اللعبة";
img.loading="lazy";
img.onerror=()=>img.replaceWith(make("div","cover empty","الصورة غير متاحة"));
card.appendChild(img);
}else{
card.appendChild(make("div","cover empty","لا توجد صورة"));
}

const info=make("div","info","");
info.appendChild(make("h2","",g.name||"لعبة بدون اسم"));
info.appendChild(make("div","size","الحجم: "+(g.size||"غير محدد")));
info.appendChild(make("div","category","التصنيف: "+(g.category||"أخرى")));
info.appendChild(make("div","players","🎮 عدد اللاعبين: "+(g.players||"غير محدد")));
info.appendChild(make("p","description",g.description||""));

if(g.video&&isYouTubeUrl(g.video)){
const link=make("a","video-btn","▶ عرض الإعلان");
link.href=g.video;
link.target="_blank";
link.rel="noopener noreferrer";
info.appendChild(link);
}

card.appendChild(info);
root.appendChild(card);
});
}

$("search").addEventListener("input",render);
$("category").addEventListener("change",render);

applyTheme();
render();

onSnapshot(collection(db,"games_ps5"),snap=>{
savedGames=snap.docs
.map(d=>({...d.data(),id:d.id}))
.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
render();
},err=>{
console.error(err);
savedGames=[];
render();
});
</script>
</body>
</html>
