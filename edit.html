<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة الألعاب - FANTASY STORE</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #090d1b;
  color: white;
  text-align: center;
  padding: 25px 15px;
}
.box {
  max-width: 500px;
  margin: 35px auto;
  padding: 22px;
  background: #151b30;
  border: 1px solid #7048ff;
  border-radius: 16px;
}
input, textarea, select, button {
  box-sizing: border-box;
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 8px;
  border: 1px solid #454d70;
  font-size: 16px;
}
input, textarea, select {
  background: #090d1b;
  color: white;
}
button {
  background: #7048ff;
  color: white;
  border: none;
  cursor: pointer;
  font-weight: bold;
}
.hidden { display: none; }
#message { color: #ffb3b3; }
.note { color: #c5c9df; font-size: 13px; }
</style>
</head>
<body>

<h1>🎮 FANTASY STORE</h1>
<p>لوحة إدارة الألعاب</p>

<div class="box" id="loginBox">
  <h2>🔒 للمالك فقط</h2>
  <p>أدخل كلمة مرور الإدارة</p>
  <input id="password" type="password" placeholder="كلمة المرور">
  <button onclick="login()">دخول الإدارة</button>
  <p id="message"></p>
</div>

<div class="box hidden" id="adminBox">
  <h2>➕ إضافة لعبة</h2>

  <input id="gameName" placeholder="اسم اللعبة">
  <input id="gameSize" placeholder="حجم اللعبة مثال: 25 GB">

  <select id="gameCategory">
    <option value="أكشن">أكشن</option>
    <option value="مغامرات">مغامرات</option>
    <option value="رعب">رعب</option>
    <option value="أطفال">أطفال</option>
    <option value="رياضة">رياضة</option>
  </select>

  <textarea id="gameDescription" placeholder="وصف اللعبة"></textarea>
  <label>صورة غلاف اللعبة</label>
  <input id="gameImage" type="file" accept="image/*">

  <button onclick="addGame()">حفظ اللعبة</button>
  <button onclick="logout()" style="background:#b83250">خروج من الإدارة</button>
  <p id="saveMessage"></p>
  <p class="note">
    تنبيه: الحفظ الحالي محلي على هذا المتصفح، وليس قاعدة بيانات مشتركة.
  </p>
</div>

<script>
const OWNER_PASSWORD = "CHANGE_THIS_PASSWORD";
const STORAGE_KEY = "fantasyStoreManagedGamesV1";

function login() {
  const entered = document.getElementById("password").value;

  if (entered !== OWNER_PASSWORD) {
    document.getElementById("message").textContent =
      "غير مسموح بالدخول؛ لوحة الإدارة للمالك فقط.";
    return;
  }

  sessionStorage.setItem("fantasyOwnerSession", "yes");
  showAdmin();
}

function showAdmin() {
  if (sessionStorage.getItem("fantasyOwnerSession") !== "yes") return;

  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("adminBox").classList.remove("hidden");
}

function logout() {
  sessionStorage.removeItem("fantasyOwnerSession");
  location.reload();
}

function addGame() {
  const name = document.getElementById("gameName").value.trim();
  const size = document.getElementById("gameSize").value.trim();
  const category = document.getElementById("gameCategory").value;
  const description = document.getElementById("gameDescription").value.trim();
  const file = document.getElementById("gameImage").files[0];

  if (sessionStorage.getItem("fantasyOwnerSession") !== "yes") {
    alert("غير مسموح بالدخول.");
    location.reload();
    return;
  }

  if (!name || !size) {
    alert("اكتب اسم اللعبة وحجمها أولاً.");
    return;
  }

  if (file && file.size > 700 * 1024) {
    alert("حجم الصورة كبير. اختار صورة أقل من 700 كيلوبايت.");
    return;
  }

  const save = (image) => {
    try {
      const games = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

      games.push({
        id: Date.now(),
        name,
        size,
        category,
        description,
        image
      });

      localStorage.setItem(STORAGE_KEY, JSON.stringify(games));
      document.getElementById("saveMessage").textContent =
        "تم حفظ اللعبة في هذا المتصفح.";
      document.getElementById("gameName").value = "";
      document.getElementById("gameSize").value = "";
      document.getElementById("gameDescription").value = "";
      document.getElementById("gameImage").value = "";
    } catch (error) {
      alert("تعذر الحفظ. جرّب صورة أصغر.");
    }
  };

  if (file) {
    const reader = new FileReader();
    reader.onload = () => save(reader.result);
    reader.onerror = () => alert("تعذر قراءة الصورة.");
    reader.readAsDataURL(file);
  } else {
    save("");
  }
}
</script>

</body>
</html>
